<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha</title>
    
    <!-- Biblioteca de icones Remixicon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css"
        integrity="sha512-kJlvECunwXftkPwyvHbclArO8wszgBGisiLeuDFwNM8ws+wKIw0sv1os3ClWZOcrEB2eRXULYUsm8OVRGJKwGA=="
        crossorigin="anonymous" referrerpolicy="no-referrer">

    <link rel="stylesheet" href="../assets/css/reset.css">
    <link rel="stylesheet" href="../assets/css/forget.css">
    <script defer src="../assets/js/script.js"></script>
</head>
<body>
    <main class="login">
        <img src="../assets/imgs/fundo.gif" alt="Imagem fundo de login" class="login_img">

        <form action="" class="login_form">
            <h1 class="login_title">Recuperar Senha</h1>
            <div class="login_content">

                <div class="login_box">
                    <i class="ri-mail-fill login_icon"></i>
                    <div class="login_box_input">
                        <input type="email" id="forgot_email" class="login_input" placeholder="" required>
                        <label class="login_label" for="forgot_email">E-mail</label>
                    </div>
                </div>

                <button type="submit" class="login_button">Enviar link de recuperação</button>

                <p class="login_register">Remembered? <a href="../index.html">Login</a></p>
            </div>
        </form>
    </main>
</body>
</html>
