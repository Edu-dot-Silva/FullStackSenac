<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            overflow: hidden;
            background: #000;
        }

        body {
            position: relative;
        }

        .video-background {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .video-background iframe {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 100vh;
            min-width: 177.77vh;
            min-height: 56.25vw;
            transform: translate(-50%, -50%);
            border: 0;
            pointer-events: none;
            filter: brightness(0.65);
        }

        .overlay {
            position: absolute;
            inset: 0;
        }

        .content {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #fff;
            padding: 2rem;
        }

    </style>
</head>
<body>
    <div class="video-background">
        <iframe
            src="https://www.youtube.com/embed/Id6i7JP-1bs?autoplay=1&mute=1&loop=1&playlist=Id6i7JP-1bs&controls=0&showinfo=0&rel=0&modestbranding=1&playsinline=1&cc_load_policy=0&iv_load_policy=3"
            title="Vídeo de fundo"
            allow="autoplay; encrypted-media; picture-in-picture"
            allowfullscreen>
        </iframe>
        <div class="overlay"></div>
    </div>

    <main class="content">
    </main>
</body>
</html>
